name: release-npm

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a dry run or publish the complete npm + GitHub Release pair.
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - release
      version:
        description: Exact unified @proofhound/* version to validate and release, for example 0.1.6.
        required: true
        type: string
      dist_tag:
        description: npm dist-tag for release mode.
        required: true
        default: latest
        type: string

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry_run:
    if: ${{ inputs.mode == 'dry_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile
      - run: pnpm run packages:version:check -- "${{ inputs.version }}"
      - run: pnpm run verify
      - run: pnpm run build
      - run: pnpm run packages:pack:check
      - run: pnpm run packages:pack
      - run: pnpm run packages:consumer:tarball -- "${{ inputs.version }}"

  release:
    if: ${{ inputs.mode == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm run packages:version:check -- "${{ inputs.version }}"
      - run: pnpm run packages:publish:check -- "${{ inputs.version }}" "https://registry.npmjs.org/"

      - name: Check GitHub release tag is unused
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(pnpm --silent run packages:version:check)"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
            exit 1
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} already exists"
            exit 1
          fi

      - run: pnpm run verify
      - run: pnpm run build
      - run: pnpm run packages:pack:check
      - run: pnpm run packages:pack
      - run: pnpm run packages:consumer:tarball -- "${{ inputs.version }}"
      - name: Publish packed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run packages:publish:packed -- .npm-packages "${{ inputs.dist_tag }}"
      - run: pnpm run packages:consumer:registry -- "${{ inputs.version }}" "https://registry.npmjs.org/"
      - run: pnpm run packages:release-notes -- "${{ inputs.version }}" "${{ inputs.dist_tag }}" .npm-packages/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(pnpm --silent run packages:version:check -- "${{ inputs.version }}")"
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "ProofHound OSS v${VERSION}" \
            --notes-file .npm-packages/release-notes.md
